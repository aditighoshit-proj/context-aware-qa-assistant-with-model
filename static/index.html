<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOGO Policy Q&amp;A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="context" aria-label="Knowledge base">
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="topics" type="button">Topics</button>
    <button class="tab" data-tab="ctx" type="button">Retrieved context</button>
  </div>
  <div id="pane-topics" class="pane">
    <p class="hint">Browse the documents and click a question to ask it.</p>
    <div id="kb"><p class="ctx-empty">Loading…</p></div>
  </div>
  <div id="pane-ctx" class="pane" hidden>
    <p class="hint">Passages sent to the model for the latest question. Green = used in the answer.</p>
    <div id="ctx"><p class="ctx-empty">Ask a question to see which passages are retrieved.</p></div>
  </div>
</aside>
<main class="app">
  <header>
    <h1>GEOGO Policy Q&amp;A</h1>
    <p>Answers come only from the company documents. If it isn’t in there, you’ll be told.</p>
  </header>

  <section id="log" class="log" aria-live="polite"></section>

  <form id="form" class="ask">
    <input id="q" type="text" placeholder="Ask about leave, remote work, expenses, IT security…" maxlength="500" autocomplete="off" required>
    <button id="send" type="submit">Ask</button>
  </form>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
